<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridTrack — Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Overlay pill ──────────────────────────── */
    .overlay-wrap {
      position: fixed;
      bottom: 20px;
      left: 20px;
      pointer-events: none;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(12, 12, 14, 0.88);
      backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(201,146,42,0.22);
      border-radius: 99px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.06);
      pointer-events: auto;
      cursor: grab;
      transition: border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
    }

    .pill:hover {
      border-color: rgba(201,146,42,0.4);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .pill:active { cursor: grabbing; }

    /* Left: session info */
    .pill-left {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 10px 20px;
    }

    .pill-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(201,146,42,0.12);
      border: 1px solid rgba(201,146,42,0.25);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .session-info {}

    .session-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      color: rgba(201,146,42,0.7);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .session-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: #F5F3EE;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    /* Divider */
    .pill-divider {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
      flex-shrink: 0;
    }

    /* Right: exit button */
    .pill-right {
      padding: 8px 10px 8px 14px;
    }

    .exit-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: linear-gradient(135deg, rgba(251,113,133,0.18) 0%, rgba(225,29,72,0.22) 100%);
      border: 1px solid rgba(251,113,133,0.3);
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #FCA5A5;
      letter-spacing: 0.03em;
    }

    .exit-btn:hover {
      background: linear-gradient(135deg, rgba(251,113,133,0.28) 0%, rgba(225,29,72,0.35) 100%);
      border-color: rgba(251,113,133,0.5);
      color: #FECDD3;
      transform: scale(1.02);
    }

    .exit-btn:active { transform: scale(0.98); }

    /* ── Notifications ─────────────────────────── */
    .notif-stack {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 1000;
    }

    .notification {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      background: rgba(12,12,14,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(201,146,42,0.25);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #D6D3CC;
      animation: notifIn 0.28s cubic-bezier(0.22,1,0.36,1) both;
      transition: opacity 0.25s, transform 0.25s;
    }

    @keyframes notifIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div class="overlay-wrap">
    <div class="pill" id="pill">
      <div class="pill-left">
        <div class="pill-icon">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="5.5" stroke="#C9922A" stroke-width="1.3"/>
            <path d="M7 4.5v2.8l1.8 1.2" stroke="#C9922A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="session-info">
          <div class="session-label">Session</div>
          <div class="session-timer" id="sessionTimer">00:00</div>
        </div>
      </div>
      <div class="pill-divider"></div>
      <div class="pill-right">
        <button class="exit-btn" id="checkoutBtn">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          End Session
        </button>
      </div>
    </div>
  </div>

  <div class="notif-stack" id="notificationContainer"></div>

  <script>
    /* ══════════════════════════════════════════════
       SESSION TIMER
       Always starts from 0 when overlay loads.
       The overlay is created fresh each check-in
       (see main.js — overlayWindow.show() is called
       after createOverlayWindow()), so this is
       inherently per-session.
    ══════════════════════════════════════════════ */
    const timerEl = document.getElementById('sessionTimer');
    let startTs   = Date.now(); // ← epoch of THIS session start (always now)
    let rafId     = null;
    let running   = true;

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatElapsed(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return h > 0
        ? `${pad(h)}:${pad(m)}:${pad(s)}`
        : `${pad(m)}:${pad(s)}`;
    }

    function tick() {
      if (!running) return;
      timerEl.textContent = formatElapsed(Date.now() - startTs);
      rafId = requestAnimationFrame(tick);
    }

    tick();

    function stopTimer() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      timerEl.textContent = '00:00';
    }

    /* ══════════════════════════════════════════════
       DRAG
    ══════════════════════════════════════════════ */
    const pill  = document.getElementById('pill');
    let dragging = false;
    let ox = 0, oy = 0, startX = 0, startY = 0;

    pill.addEventListener('mousedown', e => {
      if (e.target.closest('#checkoutBtn')) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      const r = pill.getBoundingClientRect();
      ox = r.left; oy = r.top;
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const nx = Math.max(8, Math.min(ox + e.clientX - startX, window.innerWidth  - pill.offsetWidth  - 8));
      const ny = Math.max(8, Math.min(oy + e.clientY - startY, window.innerHeight - pill.offsetHeight - 8));
      pill.parentElement.style.cssText = `position:fixed;left:${nx}px;top:${ny}px;bottom:auto`;
    });

    document.addEventListener('mouseup', () => { dragging = false; });

    /* ══════════════════════════════════════════════
       IPC — screenshot notification
    ══════════════════════════════════════════════ */
    if (window.api?.onScreenshotTaken) {
      window.api.onScreenshotTaken(filename => {
        const c = document.getElementById('notificationContainer');
        const n = document.createElement('div');
        n.className = 'notification';
        n.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <rect x="1.5" y="3" width="11" height="8.5" rx="1.5" stroke="#C9922A" stroke-width="1.2"/>
            <circle cx="7" cy="7.2" r="2" stroke="#C9922A" stroke-width="1.2"/>
          </svg>
          <span>${filename}</span>`;
        c.appendChild(n);
        setTimeout(() => {
          n.style.opacity = '0';
          n.style.transform = 'translateX(12px)';
          setTimeout(() => n.remove(), 280);
        }, 3200);
      });
    }

    /* ══════════════════════════════════════════════
       CHECKOUT
    ══════════════════════════════════════════════ */
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      stopTimer();
      if (window.api?.checkOut) await window.api.checkOut();
    });
  </script>
</body>
</html>
