version: '3.8'

services:
  app:
    build: .
    container_name: biometric-tracker
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - biometric-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  biometric-network:
    driver: bridge