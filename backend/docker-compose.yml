services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridtrack-backend
    restart: always
    environment:
      # These will be read from a .env file on your VPS
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - MIN_SCREENSHOT_INTERVAL=${MIN_SCREENSHOT_INTERVAL:-60}
      - MAX_SCREENSHOT_INTERVAL=${MAX_SCREENSHOT_INTERVAL:-300}
    ports:
      - "22843:3000"
    volumes:
      # Persist logs if needed
      - backend_logs:/app/logs
    networks:
      - gridtrack_network

  # Optional: PostgreSQL database (if you're not using external DB)
  # Remove this if you're using an external database (187.127.139.208)
  postgres:
    image: postgres:15-alpine
    container_name: gridtrack-postgres
    restart: always
    environment:
      POSTGRES_USER: gridtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gridtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gridtrack_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gridtrack_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local